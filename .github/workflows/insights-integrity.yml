name: Insights Integrity

on:
  pull_request:
    paths:
      - "src/capitalbench/insights.py"
      - "src/capitalbench/market_environments.py"
      - "tests/test_insights.py"
      - "tests/test_market_environments.py"
      - "insights/**"
      - "apps/web/**"
      - ".github/workflows/*insights*.yml"
      - ".github/workflows/capitalbench-resolver.yml"
      - ".github/workflows/interim-performance.yml"
  push:
    branches:
      - main
    paths:
      - "src/capitalbench/insights.py"
      - "src/capitalbench/market_environments.py"
      - "tests/test_insights.py"
      - "tests/test_market_environments.py"
      - "insights/**"
      - "apps/web/**"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install CapitalBench
        run: python -m pip install -e ".[test]"

      - name: Test insight engines
        run: pytest tests/test_insights.py tests/test_market_environments.py

      - name: Validate published insight artifacts
        run: capitalbench validate-insights --insights-dir insights

      - name: Test generated web data
        working-directory: apps/web
        run: |
          npm ci
          npm run api:test
