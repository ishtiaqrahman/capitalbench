  - id: vnext-event-ranking-replay-2026-07-21
    date: 2026-07-21
    status: complete
    decision: rejected
    question: Do timestamped event evidence, pairwise candidate-vs-SPY ranking, and abstention improve weekly portfolio alpha?
    method: Sequential private replay with control, balanced lanes, event evidence, and pairwise ranking plus abstention.
    sample: Weekly development, validation, and sealed-confirmation blocks with non-overlapping windows where data permits.
    models: [google-gemini-3-1-pro, xai-grok-4-3, xai-grok-4-5, openai-gpt-5-6-sol]
    calls: 32
    gates: Mean gain at least 0.50 points, positive alpha versus SPY, 3 of 4 models and 4 of 6 periods improved, better capture/regret, and no worse worst period.
    findings:
      - H7 improved mean top-five alpha over H4 by only 0.16 percentage points; 8 of 13 valid pairs, 3 model families, and 2 episodes improved.
      - Top-three shortlist capture increased by 2, but mean shortlist regret worsened by 0.48 percentage points.
      - Episode effects decayed from +1.01 and +0.39 points in V1-V2 to 0.00 and -1.03 points in V3-V4.
      - Timely strong/moderate candidates averaged -0.58% realized alpha versus SPY; other candidates averaged -0.68%.
      - H8 was not run because H7 failed the frozen search gate; six Gemini records failed for temporary provider availability, leaving 13 valid pairs.
    lessons:
      - Event structuring increased capture in some periods without reliably improving candidate quality or returns.
      - Do not spend on pairwise ranking or force broader event coverage from this result.
    limitations:
      - Historical replay is reject-only evidence because models may remember outcomes.
    canonical_artifacts:
      - docs/experiments/vnext-event-ranking-replay-2026-07-21.md
      - experiments/vnext-event-ranking-replay-2026-07-21.yaml
      - docs/vnext_event_ranking_replay_report.md
      - research/results/vnext-event-ranking-replay-2026-07-21.json
    related: [vnext-historical-replay-stage1b-2026-07-21, vnext-historical-replay-stage1c-2026-07-21]
    next_action: Stop this branch and use the complete July 17 production ledger to diagnose the dominant loss stage after July 24.

  - id: v2-july17-ledger-diagnostic-2026-07-24
    date: 2026-07-21
    status: complete
    decision: diagnostic_only
    question: In the first complete eight-model production V2 weekly round, is return lost mainly in candidate search, candidate ranking, or portfolio construction?
    method: Resolve one frozen shared price snapshot, then decompose oracle regret and audit candidate forecasts, rejected candidates, SPY hurdle decisions, and construction counterfactuals.
    sample: CB-2026-07-17-1W after the July 24 close; eight frozen production models with complete candidate ledgers.
    models: [openai-gpt-5-5, openai-gpt-5-6-sol, google-gemini-3-1-pro, xai-grok-4-3, xai-grok-4-5, anthropic-claude-opus-4-7, anthropic-claude-opus-4-8, anthropic-claude-fable-5]
    calls: 0
    gates: No model calls. A loss stage is dominant only if its aggregate share exceeds 50%; the result authorizes design work only, not production adoption.
    findings:
      - V2 averaged 1.71% alpha versus SPY in this one window, and five of eight candidate ledgers contained the eventual winner.
      - Search, ranking, and construction contributed 27.37%, 41.72%, and 30.91% of regret; no stage exceeded the frozen 50% dominance threshold.
      - Mean candidate forecast rank correlation was 0.344, interval coverage was 77.01%, and average forecast error was 1.85 percentage points.
    lessons:
      - The complete prospective ledger supports measuring every loss stage without hindsight reconstruction, but one window cannot justify a targeted method change.
    limitations:
      - One weekly period and overlap with earlier July windows limit independence.
    canonical_artifacts:
      - docs/experiments/v2-next-research-2026-07-21.md
      - experiments/v2-next-research-2026-07-21.yaml
      - scripts/analyze_v2_resolution_diagnostics.py
      - docs/v2_next_research_july17_diagnostic.md
    related: [v2-july13-resolution-diagnostic-2026-07-21, vnext-event-ranking-replay-2026-07-21]
    next_action: Preserve this completed one-window result and use the later multi-round V2.2 evidence when designing return-improvement treatments.

  - id: vnext-symmetric-coverage-replay-2026-07-21
    date: 2026-07-21
    status: complete
    decision: rejected
    question: Can symmetric option-level evidence, exhaustive fixed-lane search, and a hard evidence gate improve weekly returns over H4?
    method: Twelve single-turn H9 historical development calls paired with H4 controls across four non-overlapping weekly periods; up to three exact H4 control repairs are allowed for prior transport failures.
    sample: Four already-adaptive weekly periods V1-V4; three model families and 12 paired cells.
    models: [google-gemini-3-1-pro, xai-grok-4-5, openai-gpt-5-6-sol]
    calls: 15
    gates: Positive H9 alpha, at least 0.50-point paired gain, 7 positive pairs, all 3 models, 3 episodes, 20% regret reduction, nonnegative capture change, and no worse worst episode.
    findings:
      - Eight valid paired cells produced mean H9 alpha of -0.43% versus SPY and only a 0.08-point mean gain over H4.
      - Only 3 of 8 pairs, 1 of 2 valid models, and 1 of 4 episodes improved; shortlist regret worsened by 81.24% and top-three capture fell by one.
      - The unrestricted wildcard produced four top-three captures, more than all fixed lanes combined; seven Gemini operations failed with quota or availability errors.
    lessons:
      - Forced lane quotas dilute the shortlist, and broad macro-to-asset mappings are not discriminative enough to support a hard evidence gate.
      - Symmetric coverage by itself does not solve candidate ranking or improve realized return.
    limitations:
      - Reused historical development periods cannot establish prospective skill.
      - Gemini produced no valid paired cells, leaving eight valid pairs across GPT-5.6 SOL and Grok 4.5.
    canonical_artifacts:
      - docs/experiments/vnext-symmetric-coverage-replay-2026-07-21.md
      - experiments/vnext-symmetric-coverage-replay-2026-07-21.yaml
      - docs/vnext_symmetric_coverage_replay_report.md
      - research/results/vnext-symmetric-coverage-replay-2026-07-21.json
    related: [vnext-event-ranking-replay-2026-07-21, vnext-historical-replay-stage1b-2026-07-21, v2-july17-ledger-diagnostic-2026-07-24]
    next_action: Stop H9 and test richer mechanical decision-context features without model calls; do not change production.

  - id: historical-decision-context-backfill-2026-07-21
    date: 2026-07-21
    status: complete
    decision: accepted
    question: Do richer horizon-specific price features contain a stable cross-sectional signal that improves equal-weight top-five returns over SPY?
    method: Fetch one cutoff-safe daily adjusted-price history per symbol, reconstruct weekly and monthly V2-style features at each entry date, and evaluate five frozen ranking rules without model calls.
    sample: "The 46 resolved V1 rounds from the canonical predictability dataset: 30 weekly and 16 monthly, with purged non-overlapping and chronological split diagnostics."
    models: []
    calls: 0
    gates: Weekly only may advance; require positive non-overlapping alpha, beat rate above 50%, positive discovery and holdout alpha, positive leave-best-round-out alpha, and at least 90% feature coverage. Monthly is diagnostic because too few independent windows exist.
    findings:
      - All 69 symbols and all 46 rounds had sufficient cutoff-safe Yahoo adjusted-price and volume history.
      - Weekly quality-pullback cleared the frozen gate with 0.36% all-round alpha, 0.48% discovery alpha, 0.09% holdout alpha, and 0.28% alpha with a 62.5% beat rate across eight non-overlapping weeks.
      - The other four weekly rules had negative non-overlapping alpha; no monthly rule advanced.
      - The positive signal remains fragile because removing the best non-overlapping week changes that subset to -0.31% alpha.
    lessons:
      - A medium-horizon active trend combined with a recent relative pullback and modest low-volatility and drawdown preferences is the first frozen mechanical rule to clear the historical weekly screen.
      - Plain trend, volume confirmation, and low-beta active strength do not improve returns in this sample.
    limitations:
      - Historical outcomes are reused and can reject weak rules but cannot establish prospective skill.
      - Yahoo adjusted-price history is the fallback source because no Tiingo credential is present locally.
      - Holdout alpha is only 0.09%, and non-overlapping leave-best-round-out alpha is negative.
    canonical_artifacts:
      - docs/experiments/historical-decision-context-backfill-2026-07-21.md
      - experiments/historical-decision-context-backfill-2026-07-21.yaml
      - docs/historical_decision_context_backfill_report.md
      - research/results/historical-decision-context-backfill-2026-07-21.json
    related: [model-performance-predictability-2026-07-20, mechanical-candidate-screen-2026-07-21, vnext-symmetric-coverage-replay-2026-07-21]
    next_action: Run quality-pullback unchanged as a zero-call private weekly shadow; do not alter production unless prospective evidence passes a separately frozen gate.

  - id: model-quality-hybrid-screen-2026-07-21
    date: 2026-07-21
    status: complete
    decision: rejected
    question: Can the frozen weekly quality-pullback signal materially improve the returns of CapitalBench model portfolios at zero additional model-call cost?
    method: Reconstruct every eligible historical model allocation and compare the original portfolio with a 25% quality sleeve, a conviction-quality union rerank, and a within-holdings quality tilt.
    sample: All eligible model decisions in the 46-round predictability dataset; weekly is gated and monthly is diagnostic only.
    models: [historical_official_roster]
    calls: 0
    gates: A weekly hybrid must improve mean return by at least 0.75 points, produce positive alpha versus SPY, improve over 60% of model-round pairs and 60% of models, remain positive in holdout and non-overlapping rounds, and remain positive after removing its best round.
    findings:
      - The 25% quality sleeve improved mean weekly return by 0.32 points but still produced -0.60% alpha versus SPY, below the 0.75-point improvement gate.
      - The conviction-quality union improved return by 0.16 points, while reweighting only existing holdings reduced return by 0.02 points.
      - The 25% sleeve improved future down-market periods by 0.93 points but reduced return by 0.16 points in future up-market periods; that outcome state is not known at entry.
    lessons:
      - The quality signal adds some candidates that models missed, but post-response blending is too weak to solve underperformance and is not the target research direction.
      - Reweighting the model's existing holdings does not help; any useful intervention must improve the information or instructions used inside the LLM call.
    limitations:
      - The quality signal was discovered on the same historical sample, so this screen can reject combinations but cannot confirm prospective skill.
      - Future SPY direction is an outcome-only attribution and cannot be used as a live router.
    canonical_artifacts:
      - docs/experiments/model-quality-hybrid-screen-2026-07-21.md
      - experiments/model-quality-hybrid-screen-2026-07-21.yaml
      - docs/model_quality_hybrid_screen_report.md
      - research/results/model-quality-hybrid-screen-2026-07-21.json
    related: [historical-decision-context-backfill-2026-07-21, model-performance-predictability-2026-07-20, v2-july17-ledger-diagnostic-2026-07-24]
    next_action: Stop post-response overlays and test whether the four LLMs use compact quality evidence when it is supplied and explicitly audited inside the call.

  - id: llm-quality-input-replay-2026-07-21
    date: 2026-07-21
    status: complete
    decision: rejected
    question: Can compact option-level quality evidence, with or without an explicit evidence-challenge instruction, improve weekly candidate returns across all four research LLMs?
    method: Pair two single-turn treatments against saved H4 controls across three historical weekly periods; Q1 adds only the evidence table, while Q2 also requires high-evidence candidates to be considered in the model's own shortlist and final ranking. Repair two exact Gemini controls that previously failed with HTTP 503.
    sample: Twelve paired cells per treatment across V1-V3 and Gemini 3.5 Flash, Grok 4.3, Grok 4.5, and GPT-5.6 SOL.
    models: [google-gemini-3-1-pro, xai-grok-4-3, xai-grok-4-5, openai-gpt-5-6-sol]
    calls: 26
    gates: Each treatment must have 10 valid pairs, at least 0.75-point mean return improvement, positive treatment alpha versus SPY, 8 positive pairs, all 4 models positive, 2 of 3 periods positive, nonnegative regret reduction, and no worse worst-period alpha.
    findings:
      - Q1 improved 8 of 9 valid pairs across all three valid models and all three periods, with 1.59-point mean improvement and 0.13% treatment alpha.
      - Q2 improved all 8 valid pairs across all three valid models and all three periods, with 2.90-point mean improvement and 1.50% treatment alpha.
      - Both treatments failed the frozen gate because Google quota errors left no valid Gemini pairs; Q2 also worsened mean shortlist regret by 1.40 points.
    lessons:
      - Compact option-level evidence can materially change the LLMs' own selections; explicit consideration requirements were stronger than information alone.
      - Q2 appears to improve final ranking more than oracle candidate capture, so realized return must remain the primary confirmation endpoint.
    limitations:
      - The evidence score was discovered on reused historical data, and current models may remember historical outcomes.
      - Gemini 3.5 Flash exhausted its free-tier request quota, and one Grok 4.5 Q2 response violated the frozen evidence-use requirement.
    canonical_artifacts:
      - docs/experiments/llm-quality-input-replay-2026-07-21.md
      - experiments/llm-quality-input-replay-2026-07-21.yaml
      - docs/llm_quality_input_replay_report.md
      - research/results/llm-quality-input-replay-2026-07-21.json
    related: [historical-decision-context-backfill-2026-07-21, model-quality-hybrid-screen-2026-07-21, vnext-historical-replay-stage1b-2026-07-21]
    next_action: The operator adopted Q1's information-only table as Portfolio V2.2 despite the failed research gate. Preserve the fixed formula and evaluate it prospectively; do not describe adoption as confirmation.

  - id: llm-quality-input-confirmation-2026-07-21
    date: 2026-07-21
    status: complete
    decision: rejected
    question: Does unchanged Q2 retain its return improvement across three different historical periods and all four research LLMs?
    method: Twelve single-turn Q2 calls on D1-D3 paired with twelve previously saved valid H4 controls; use the configured Gemini 3.1 Pro preview endpoint instead of the exhausted Flash override.
    sample: Twelve paired cells across CB-2026-05-24-1W, CB-2026-06-02-1W, and CB-2026-06-09-1W.
    models: [google-gemini-3-1-pro, xai-grok-4-3, xai-grok-4-5, openai-gpt-5-6-sol]
    calls: 12
    gates: Require 10 valid pairs, at least 1.00-point mean return improvement, positive treatment alpha, 8 positive pairs, all 4 models positive, 2 of 3 periods positive, and no more than 0.50-point deterioration in the worst period. Capture and regret are diagnostics, not gates.
    findings:
      - Eight valid OpenAI and xAI pairs produced 1.25-point mean improvement but remained at -0.42% treatment alpha versus SPY.
      - Only 3 of 8 valid pairs, 3 of 4 represented models, and 1 of 3 periods improved; all valid models improved in D2 and all valid models declined in D1 and D3.
      - Gemini 3.1 Pro Preview returned quota errors in all three periods, and one Grok 4.3 response was invalid JSON.
    lessons:
      - Mandatory quality-candidate quotas are episode-dependent and do not generalize across historical periods.
      - Compact evidence remains a plausible input aid, but forcing its candidates into the final five over-anchors models when the useful return driver is elsewhere.
    limitations:
      - These periods were used by earlier H4 development, although Q2 itself was not tuned on them.
      - Historical replay cannot establish prospective skill.
      - Google quota errors prevented a four-model confirmation, but the valid-model breadth gate already failed.
    canonical_artifacts:
      - docs/experiments/llm-quality-input-confirmation-2026-07-21.md
      - experiments/llm-quality-input-confirmation-2026-07-21.yaml
      - docs/llm_quality_input_confirmation_report.md
      - research/results/llm-quality-input-confirmation-2026-07-21.json
    related: [llm-quality-input-replay-2026-07-21, vnext-historical-replay-stage1b-2026-07-21]
    next_action: Stop Q2. Preserve Q1 unchanged for a four-model confirmation after Google capacity returns; do not alter production.

  - id: portfolio-v3-anti-extrapolation-replay-2026-08-13
    date: 2026-08-13
    status: complete
    decision: rejected
    question: Can one fixed anti-extrapolation candidate-slate and probabilistic-ranking treatment produce positive weekly alpha versus SPY and improve over paired V2.2 decisions?
    method: Build a deterministic cutoff-safe candidate slate, require every model to rank the full slate with probabilities and return quantiles, and apply fixed 35/35/30 construction in one offline call.
    sample: Exactly three non-overlapping post-release V2.2 weekly windows (July 21-28, July 28-August 4, and August 4-11) and four approved model families.
    models: [openai-gpt-5-6-sol, google-gemini-3-1-pro, xai-grok-4-3, xai-grok-4-5]
    calls: 12
    gates: Require 10 valid pairs, positive treatment alpha, at least 1.00-point paired improvement, 8 positive pairs, 3 positive models, 2 positive periods, no worse than -0.50 point in the weakest period, and non-declining selected top-three capture.
    findings:
      - The pre-test V2.2 diagnosis found -1.16-point approved-model alpha across 44 cells, 13/44 ledger top-three captures, 6/44 selected top-three captures, and negative within-ledger forecast rank correlation.
      - Eleven valid cells produced -0.19% mean V3A alpha versus SPY, compared with -1.62% for their saved V2.2 controls, for a 1.43-point paired improvement.
      - V3A beat SPY in 5 of 11 valid cells and improved on V2.2 in 6 of 11; selected winner capture rose from 0 to 3 and selected top-three capture rose from 1 to 3.
      - Grok 4.3 averaged 2.73% alpha and a 3.60-point paired improvement, Gemini averaged -2.10% alpha while improving 1.07 points over its V2.2 controls, and Grok 4.5 averaged -1.77% alpha.
      - The slate contained the eventual winner in all three periods, but V3A averaged -2.46% versus SPY in its weakest period and failed the positive-alpha, positive-pair, positive-model, and worst-period gates.
      - All three Gemini transport failures were filled with valid responses; one OpenAI credit-balance failure remains, leaving 11 of 12 valid cells.
      - The completed record contains 12 planned cells and 15 replay provider attempts because the operator explicitly authorized one replacement attempt for each of the three original Gemini quota failures.
    lessons:
      - Balanced cutoff-safe search substantially improved candidate coverage; ranking discipline and unsupported continuation remained the main failure.
      - A positive average and one strong model do not justify overriding a frozen breadth and downside gate.
    limitations:
      - The candidate-slate idea was designed after reviewing resolved V2.2 behavior, so historical replay can advance only to a fresh prospective shadow.
      - Three test sets are a small sample and cannot prove persistent alpha.
      - One OpenAI provider failure left 11 valid cells and only two OpenAI periods.
      - The three operator-authorized Gemini replacement attempts exceeded the original twelve-attempt ceiling, so the expanded-coverage result cannot qualify as a frozen-gate acceptance even if other gates had passed.
    canonical_artifacts:
      - docs/experiments/portfolio-v3-anti-extrapolation-replay-2026-08-13.md
      - experiments/portfolio-v3-anti-extrapolation-replay-2026-08-13.yaml
      - scripts/run_portfolio_v3_replay.py
      - docs/portfolio_v3_anti_extrapolation_replay_report.md
      - research/results/portfolio-v3-anti-extrapolation-replay-2026-08-13.json
    related: [llm-quality-input-confirmation-2026-07-21, llm-quality-input-replay-2026-07-21, v2-july17-ledger-diagnostic-2026-07-24]
    next_action: Keep V3A rejected. Do not tune or rerun these three sets; use the separately labeled compliance diagnostic only to design a fresh prospective successor.

  - id: portfolio-v3-anti-extrapolation-compliance-diagnostic-2026-08-13
    date: 2026-08-13
    status: complete
    decision: diagnostic_only
    question: Would strict enforcement of V3A's anti-continuation instruction improve the already-saved model selections?
    method: Zero-call post-hoc gate that admits overreaction calls only at a model-estimated 55% or greater chance of beating SPY, preserves model rank, and allocates every unused 35/35/30 slot to SPY.
    sample: The eleven valid model-period responses from the three-set V3A replay.
    models: [openai-gpt-5-6-sol, google-gemini-3-1-pro, xai-grok-4-3, xai-grok-4-5]
    calls: 0
    gates: Diagnostic only; the rule was defined after outcomes were inspected and cannot pass an adoption gate.
    findings:
      - Counterfactual mean alpha was 1.04% versus SPY, 1.23 points above original V3A and 2.66 points above saved V2.2 controls.
      - Nine of eleven cells were nonnegative versus SPY, eight improved on V2.2, and the weakest period averaged -0.04% alpha.
      - OpenAI averaged 0.73% alpha, Gemini -0.04%, Grok 4.3 2.78%, and Grok 4.5 0.59%; three of four represented models were positive on average.
    lessons:
      - The strongest initial lead was to require a confidence margin, reject unsupported continuation, and allocate unfilled slots to SPY; the later robustness diagnostic simplified this further by excluding continuation entirely.
      - Candidate coverage is no longer the dominant bottleneck in these three periods.
    limitations:
      - This is an outcome-informed counterfactual on the same eleven cells and cannot validate future alpha.
      - One OpenAI cell remains missing; no value was imputed.
    canonical_artifacts:
      - scripts/analyze_portfolio_v3_compliance.py
      - docs/portfolio_v3_anti_extrapolation_compliance_diagnostic.md
      - docs/experiments/portfolio-v3-confidence-evidence-successor-2026-08-13.md
      - research/results/portfolio-v3-anti-extrapolation-compliance-diagnostic-2026-08-13.json
    related: [portfolio-v3-anti-extrapolation-replay-2026-08-13]
    next_action: Preserve this intermediate diagnostic as research history and follow the later overreaction-only V3.0 candidate; do not apply either post-hoc result to production.

  - id: portfolio-v3-robustness-diagnostic-2026-08-14
    date: 2026-08-14
    status: complete
    decision: diagnostic_only
    question: Is the positive overreaction-and-SPY-fallback result robust enough to define a simple Portfolio V3.0 development candidate?
    method: Reconstruct the fixed 35/35/30 portfolio from all eleven valid V3A responses, admit only model-ranked overreaction calls at a 55% SPY-beat probability, sweep nearby thresholds, and remove each model, period, and cell without making another model call.
    sample: Eleven valid model-period responses across the three exhausted V3A weekly development windows and four approved model families.
    models: [openai-gpt-5-6-sol, google-gemini-3-1-pro, xai-grok-4-3, xai-grok-4-5]
    calls: 0
    gates: Diagnostic only; positive removal and threshold checks may define a development candidate but cannot establish prospective validation or authorize production adoption.
    findings:
      - The 55% overreaction-only rule averaged 1.04% alpha versus SPY and improved 2.66 points over paired V2.2 controls.
      - Four of eleven cells strictly beat SPY, nine were nonnegative, three of four model families were positive, two of three periods were positive, and the weakest period averaged -0.04%.
      - Mean alpha remained positive after removing any one model (0.39% minimum), any one period (0.73% minimum), or any one cell (0.67% minimum).
      - Every tested probability threshold from 45% through 67.5% remained above SPY; 55% was retained because it preceded the Gemini responses rather than because it maximized this sweep.
      - A 55% probability hurdle without the overreaction label averaged -0.12%, confident continuation averaged -1.16%, and combining continuation with overreaction averaged -0.12%.
    lessons:
      - The useful model signal is the overreaction classification, not confidence alone; continuation should be excluded from the initial V3 candidate.
      - SPY fallback converts honest lack of edge into abstention and prevents forced low-confidence positions.
    limitations:
      - This is a post-hoc development analysis on three historical periods, not a prospective or independent confirmation.
      - Five of eleven cells used 100% SPY, and one OpenAI cell remains unavailable.
    canonical_artifacts:
      - docs/portfolio_v3_candidate_methodology.md
      - src/capitalbench/portfolio_v3.py
      - scripts/analyze_portfolio_v3_robustness.py
      - docs/portfolio_v3_robustness_report.md
      - research/results/portfolio-v3-robustness-diagnostic-2026-08-14.json
    related: [portfolio-v3-anti-extrapolation-replay-2026-08-13, portfolio-v3-anti-extrapolation-compliance-diagnostic-2026-08-13]
    next_action: Preserve this exact V3.0 candidate and stop tuning on the three development periods; any next model calls must be a separately authorized fresh prospective shadow.

  - id: portfolio-v3-holdout-comparison-2026-08-14
    date: 2026-08-14
    status: complete
    decision: rejected
    question: Does unchanged V3.0 beat SPY and exact paired V2.2 controls strongly enough to replace V2.2 in a same-size twelve-attempt test?
    method: Freeze three non-overlapping one-day-shifted V2.2 weekly rounds, call the same four approved model families once per period, apply the fixed overreaction-at-55-percent rule with SPY fallback, and reuse official V2.2 results without baseline calls.
    sample: Twelve planned model-period cells across July 22-29, July 29-August 5, and August 5-12; eight responses were valid.
    models: [openai-gpt-5-6-sol, google-gemini-3-1-pro, xai-grok-4-3, xai-grok-4-5]
    calls: 12
    gates: Require 10 valid exact pairs, positive V3 alpha, at least 1.00-point improvement over V2.2, 8 nonnegative cells, 3 positive models, 2 positive periods, weakest-period alpha at least -0.50%, and non-declining selected top-three capture.
    findings:
      - Eight valid V3 cells averaged +1.94% versus SPY and improved 2.45 percentage points over exact V2.2 controls, whose mean alpha was -0.51%.
      - All eight valid cells were at or above SPY; Gemini, Grok 4.3, and Grok 4.5 all had positive mean alpha, and all three periods were positive.
      - V3 exceeded the saved -0.15% weekly V1 same-ID historical reference, but that reference is not paired and has uneven model coverage.
      - Three GPT-5.6 SOL calls failed because the OpenAI account had no credits, and one Grok 4.3 response failed the frozen top-three/schema consistency check.
      - Every performance gate passed, but the 8 valid cells failed the frozen minimum of 10, so V3.0 was not accepted.
    lessons:
      - The fixed overreaction gate and SPY fallback continue to show a broad positive return signal against exact V2.2 controls.
      - Provider availability and structured-output validity must be solved prospectively; they cannot be repaired or waived after returns are known.
    limitations:
      - The holdout windows are one day shifted from the V3 development windows and share much of the same market history, so they are not statistically independent proof.
      - V1 ended before these rounds and two tested models had sparse V1 history; the V1 comparison is context only.
      - Only eight cells were valid, below the predeclared minimum.
    canonical_artifacts:
      - docs/experiments/portfolio-v3-holdout-comparison-2026-08-14.md
      - experiments/portfolio-v3-holdout-comparison-2026-08-14.yaml
      - scripts/run_portfolio_v3_holdout.py
      - docs/portfolio_v3_holdout_comparison_report.md
      - research/results/portfolio-v3-holdout-comparison-2026-08-14.json
    related: [portfolio-v3-robustness-diagnostic-2026-08-14, portfolio-v3-anti-extrapolation-replay-2026-08-13]
    next_action: Historical closeout was to keep V2.2 and avoid tuning these windows; that research instruction remains, while the separate August 15 operator decision adopted unchanged V3.0 for future rounds.

