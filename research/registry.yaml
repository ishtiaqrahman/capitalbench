experiments:
  - id: model-performance-predictability-2026-07-20
    date: 2026-07-20
    status: complete
    decision: inconclusive
    question: Can entry-time mechanical features predict the highest-returning weekly or monthly assets?
    method: Leakage-audited feature screen with purged holdout and leave-best-out diagnostics.
    sample: 46 rounds (30 weekly, 16 monthly) and 241 model decisions.
    models: []
    calls: 0
    gates: Diagnostic screening only; no production adoption was permitted.
    findings:
      - Weekly 1-year reversal was the only loose survivor, with holdout rank IC 0.262 and purged top-three alpha 0.89%.
      - It also had discovery alpha -2.77%, full-history alpha -0.99%, exact-winner capture 0%, and a wide interval.
    lessons:
      - Simple mechanical features are not reliable enough to replace model selection.
      - Exact-winner prediction is too noisy to be the primary target.
    limitations:
      - Small overlapping sample with multiple-hypothesis risk.
    canonical_artifacts: [docs/model_performance_predictability_report.md]
    related: []
    next_action: Target positive portfolio alpha versus SPY and use mechanical features only as neutral context.

  - id: v2-improvement-research-2026-07-20
    date: 2026-07-20
    status: complete
    decision: diagnostic_only
    question: Is V2 underperformance mainly caused by candidate search, ranking, or construction?
    method: Historical regret decomposition, selected-set counterfactuals, and prompt/input audit.
    sample: Resolved weekly and monthly benchmark results available by 2026-07-20.
    models: []
    calls: 0
    gates: Diagnostic only; recommendations required independent validation.
    findings:
      - Historical model alpha averaged -0.93% weekly and -1.91% monthly.
      - Search regret averaged about 65.6% weekly and 69.3% monthly.
      - Equal weighting selected assets still produced negative alpha.
    lessons:
      - Candidate search and ranking are the primary bottlenecks.
      - Compact timely evidence is higher value than more unstructured prose.
    limitations:
      - Aggregated diagnosis does not identify a causal prompt treatment.
    canonical_artifacts: [docs/v2_improvement_research_report.md]
    related: [model-performance-predictability-2026-07-20]
    next_action: Test candidate-coverage and ranking treatments in private replay.

  - id: vnext-historical-replay-stage1-2026-07-20
    date: 2026-07-20
    status: complete
    decision: rejected
    question: Do rank-first, cross-sectional, or robustness prompts improve historical top-five selection?
    method: Paired single-turn replay across frozen weekly development episodes and four model families.
    sample: Three adaptive development episodes.
    models: [google-gemini-3-1-pro, xai-grok-4-3, xai-grok-4-5, openai-gpt-5-6-sol]
    calls: 24
    gates: Positive paired alpha, broad model/episode gains, and improved top-asset capture.
    findings:
      - Rank-first improved mean top-five alpha 1.62 percentage points in four cells but did not improve capture.
      - Cross-sectional prompting improved mean alpha 1.00 point in 3 of 4 pairs but did not improve capture.
      - The robustness treatment reduced mean alpha 1.12 points.
    lessons:
      - Ranking instructions alone lacked breadth and capture evidence.
    limitations:
      - Very small adaptive sample; no treatment reached confirmation.
    canonical_artifacts:
      - docs/experiments/vnext-historical-replay-2026-07-20.md
      - docs/vnext_historical_replay_report.md
      - experiments/vnext-historical-replay-2026-07-20.yaml
    related: [v2-improvement-research-2026-07-20]
    next_action: Improve candidate coverage before another ranking treatment.

  - id: vnext-historical-replay-stage1b-2026-07-21
    date: 2026-07-21
    status: complete
    decision: rejected
    question: Do balanced candidate lanes, regime routing, or omitted-candidate challenge improve coverage and alpha?
    method: Paired replay of H4 balanced lanes, H5 regime routing, and H6 omitted-candidate challenge.
    sample: Three adaptive development episodes and four model families.
    models: [google-gemini-3-1-pro, xai-grok-4-3, xai-grok-4-5, openai-gpt-5-6-sol]
    calls: 36
    gates: 10 valid pairs, 0.50-point mean gain, 7 positive pairs, 3 positive models, 2 positive episodes, and 30% regret reduction.
    findings:
      - H4 captured a top-two asset in 6 pairs versus 0 and reduced regret 60.74%, but mean alpha rose only 0.23 points and 5 of 12 pairs were positive.
      - H5 improved mean alpha 0.12 points; H6 reduced it 0.11 points.
    lessons:
      - Balanced lanes are the strongest search lead, but ranking and period conditioning remain weak.
    limitations:
      - D1-D3 are adaptive and cannot be used as sealed confirmation.
    canonical_artifacts:
      - docs/experiments/vnext-historical-replay-stage1b-2026-07-21.md
      - docs/vnext_historical_replay_stage1b_report.md
      - experiments/vnext-historical-replay-stage1b-2026-07-21.yaml
    related: [vnext-historical-replay-stage1-2026-07-20]
    next_action: Test ranking among balanced-lane finalists on new periods.

  - id: vnext-historical-replay-stage1c-2026-07-21
    date: 2026-07-21
    status: complete
    decision: rejected
    question: Can pairwise ranking convert H4 shortlist coverage into stronger final selections?
    method: One-call pairwise reranking diagnostic over H4 finalist sets.
    sample: Three already-adaptive periods; 11 valid model-period cells.
    models: [google-gemini-3-1-pro, xai-grok-4-3, xai-grok-4-5, openai-gpt-5-6-sol]
    calls: 12
    gates: Broad positive paired improvement and stable episode effects.
    findings:
      - Pairwise reranking added four final-five top-two captures but mean alpha rose only 0.12 points and 6 of 11 cells were positive.
      - It worsened D1, was mixed on D2, and improved D3.
    lessons:
      - Pairwise comparison needs stronger timely evidence and new periods.
    limitations:
      - Adaptive periods and only 11 valid cells; no confirmatory inference.
    canonical_artifacts:
      - docs/experiments/vnext-historical-replay-stage1c-2026-07-21.md
      - docs/vnext_historical_replay_stage1c_report.md
      - experiments/vnext-historical-replay-stage1c-2026-07-21.yaml
    related: [vnext-historical-replay-stage1b-2026-07-21]
    next_action: Stop adapting on D1-D3 and use new episode blocks with event evidence.

