  - id: vnext-event-ranking-replay-2026-07-21
    date: 2026-07-21
    status: complete
    decision: rejected
    question: Do timestamped event evidence, pairwise candidate-vs-SPY ranking, and abstention improve weekly portfolio alpha?
    method: Sequential private replay with control, balanced lanes, event evidence, and pairwise ranking plus abstention.
    sample: Weekly development, validation, and sealed-confirmation blocks with non-overlapping windows where data permits.
    models: [google-gemini-3-1-pro, xai-grok-4-3, xai-grok-4-5, openai-gpt-5-6-sol]
    calls: 32
    gates: Mean gain at least 0.50 points, positive alpha versus SPY, 3 of 4 models and 4 of 6 periods improved, better capture/regret, and no worse worst period.
    findings:
      - H7 improved mean top-five alpha over H4 by only 0.16 percentage points; 8 of 13 valid pairs, 3 model families, and 2 episodes improved.
      - Top-three shortlist capture increased by 2, but mean shortlist regret worsened by 0.48 percentage points.
      - Episode effects decayed from +1.01 and +0.39 points in V1-V2 to 0.00 and -1.03 points in V3-V4.
      - Timely strong/moderate candidates averaged -0.58% realized alpha versus SPY; other candidates averaged -0.68%.
      - H8 was not run because H7 failed the frozen search gate; six Gemini records failed for temporary provider availability, leaving 13 valid pairs.
    lessons:
      - Event structuring increased capture in some periods without reliably improving candidate quality or returns.
      - Do not spend on pairwise ranking or force broader event coverage from this result.
    limitations:
      - Historical replay is reject-only evidence because models may remember outcomes.
    canonical_artifacts:
      - docs/experiments/vnext-event-ranking-replay-2026-07-21.md
      - experiments/vnext-event-ranking-replay-2026-07-21.yaml
      - docs/vnext_event_ranking_replay_report.md
      - research/results/vnext-event-ranking-replay-2026-07-21.json
    related: [vnext-historical-replay-stage1b-2026-07-21, vnext-historical-replay-stage1c-2026-07-21]
    next_action: Stop this branch and use the complete July 17 production ledger to diagnose the dominant loss stage after July 24.

